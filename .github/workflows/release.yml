name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --locked

  build-macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Set package version from release tag
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          version="${tag#v}"
          python3 - "$version" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path("Cargo.toml")
          manifest = path.read_text()
          package = re.search(r"(?ms)^\[package\][ \t]*\r?\n.*?(?=^\[|\Z)", manifest)
          if package is None:
              raise SystemExit("Could not find [package] section in Cargo.toml")
          updated, count = re.subn(
              r'(?m)^version[ \t]*=[ \t]*"[^"]+"[ \t]*$',
              f'version = "{sys.argv[1]}"',
              package.group(),
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update package version in Cargo.toml")
          path.write_text(manifest[:package.start()] + updated + manifest[package.end():])
          PY
          cargo check
      - run: cargo build --release --locked
      - run: ./target/release/keepass-tui --help
      - name: Package and checksum binary
        run: |
          archive="keepass-tui-macos-${{ matrix.architecture }}.tar.gz"
          tar -czf "$archive" -C target/release keepass-tui
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: |
            keepass-tui-macos-${{ matrix.architecture }}.tar.gz
            keepass-tui-macos-${{ matrix.architecture }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate Homebrew formula
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          version="${tag#v}"
          arm_sha="$(cat release-assets/keepass-tui-macos-arm64.tar.gz.sha256)"
          x86_sha="$(cat release-assets/keepass-tui-macos-x86_64.tar.gz.sha256)"
          if [[ ! "$arm_sha" =~ ^[0-9a-fA-F]{64}$ || ! "$x86_sha" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Release assets must contain valid SHA-256 checksums."
            exit 1
          fi
          sed \
            -e "s/@@VERSION@@/$version/g" \
            -e "s/@@ARM64_SHA256@@/$arm_sha/g" \
            -e "s/@@X86_64_SHA256@@/$x86_sha/g" \
            Formula/keepass-tui.rb.template > release-assets/keepass-tui.rb
      - name: Verify Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::Set the HOMEBREW_TAP_TOKEN Actions secret with write access to chatilah/homebrew-tap."
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/keepass-tui-macos-arm64.tar.gz \
            release-assets/keepass-tui-macos-x86_64.tar.gz \
            release-assets/keepass-tui.rb \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: chatilah/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update Homebrew formula
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p homebrew-tap/Formula
          cp release-assets/keepass-tui.rb homebrew-tap/Formula/keepass-tui.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/keepass-tui.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git commit -m "Update keepass-tui to ${RELEASE_VERSION}"
          git push origin HEAD:main
