[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keepass-tui"
version = "0.1.0"
description = "A terminal interface for KeePass databases"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pykeepass>=4.0,<5.0",
    "pyotp>=2.9,<3.0",
]

[project.scripts]
keepass-tui = "main:main"

[tool.setuptools]
py-modules = ["main"]
